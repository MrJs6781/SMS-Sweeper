name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Keep the same debug signing key across runs so new APKs can update an installed one
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - run: gradle assembleDebug --no-daemon

      - run: mv app/build/outputs/apk/debug/app-debug.apk SMS-Sweeper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SMS-Sweeper
          path: SMS-Sweeper.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SMS-Sweeper.apk
